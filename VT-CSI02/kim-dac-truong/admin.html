<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LDBot | Quản trị đơn hàng</title>
  <style>
    * { box-sizing:border-box; }
    body { margin:0; background:#f2fbf4; color:#17302a; font:15px 'Segoe UI',sans-serif; }
    header { background:#14532d; color:#fff; padding:20px; }
    .wrap { max-width:1060px; margin:0 auto; padding:0 20px; }
    h1 { margin:0 0 4px; font-size:24px; }
    header p { margin:0; color:#bbf7d0; }
    a { color:#166534; }
    main { padding-top:24px !important; padding-bottom:30px !important; }
    .toolbar { display:flex; justify-content:space-between; gap:14px; align-items:center; flex-wrap:wrap; }
    button { cursor:pointer; border-radius:8px; border:1px solid #16a34a; background:white; padding:9px 12px; color:#14532d; font-weight:600; }
    button:hover { background:#dcfce7; }
    .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; margin:16px 0; }
    .stat,.order { background:white; border:1px solid #d1e9d7; border-radius:12px; padding:16px; }
    .stat strong { font-size:22px; display:block; color:#14532d; margin-top:8px; }
    .orders { display:grid; gap:12px; }
    .order-head { display:flex; justify-content:space-between; gap:12px; align-items:start; }
    .muted { color:#64748b; font-size:12px; }
    ul { padding-left:18px; }
    .row { display:flex; flex-wrap:wrap; align-items:center; gap:10px; }
    select { border:1px solid #bbd7c2; border-radius:8px; padding:9px; }
    .err { color:#9f1239; background:#fff1f2; padding:12px; border-radius:8px; }
  </style>
</head>
<body>
  <header><div class="wrap"><h1>🍀 Quản lý đơn hàng LDBot</h1><p>Màn hình demo dành cho quản trị viên — đăng nhập HTTP Basic</p></div></header>
  <main class="wrap">
    <div class="toolbar"><p><a href="/">← Về website khách hàng</a></p><button id="reload">🔄 Tải lại đơn</button></div>
    <div id="error" class="err" hidden></div>
    <div class="stats">
      <div class="stat">Tổng số đơn<strong id="ordersCount">0</strong></div>
      <div class="stat">Tổng giá trị đơn<strong id="sumTotal">0 ₫</strong></div>
      <div class="stat">Đang chờ xử lý<strong id="pendingCount">0</strong></div>
    </div>
    <h2>Đơn hàng gần đây</h2>
    <div id="orders" class="orders"><p>Đang tải...</p></div>
    <p class="muted">Giá trong bản demo chỉ mang tính minh họa. Dữ liệu SQLite cần ổ đĩa bền vững khi triển khai lâu dài.</p>
  </main>
<script>
"use strict";
const $ = id => document.getElementById(id);
const money = n => new Intl.NumberFormat("vi-VN",{style:"currency",currency:"VND",maximumFractionDigits:0}).format(n);
const statuses = {pending:"Chờ xác nhận",confirmed:"Đã xác nhận",preparing:"Đang chế biến",ready:"Sẵn sàng",completed:"Hoàn thành",cancelled:"Đã hủy"};
function node(tag, value, classname) { const x=document.createElement(tag); if(value!==undefined)x.textContent=String(value); if(classname)x.className=classname; return x; }
function fail(error) { $("error").textContent = "Lỗi: "+error.message; $("error").hidden = false; }
async function request(path,options={}) {
 const res=await fetch(path,{credentials:"same-origin",...options});
 let data;try{data=await res.json()}catch{throw Error("Phản hồi không hợp lệ")}
 if(!res.ok)throw Error(typeof data.detail==="string"?data.detail:`HTTP ${res.status}`);
 return data;
}
async function loadOrders() {
 $("error").hidden=true;
 try {
  const orders=await request("/api/admin/orders");
  $("ordersCount").textContent=orders.length;
  $("sumTotal").textContent=money(orders.filter(o=>o.status!=="cancelled").reduce((s,o)=>s+o.total_vnd,0));
  $("pendingCount").textContent=orders.filter(o=>["pending","confirmed","preparing"].includes(o.status)).length;
  const root=$("orders");root.replaceChildren();
  if(!orders.length){root.append(node("p","Chưa có đơn hàng nào."));return}
  for(const o of orders){
   const card=node("article",undefined,"order");
   const head=node("div",undefined,"order-head");
   const info=node("div");info.append(node("strong",`Đơn #${o.id} — ${o.customer_name}`));
   info.append(node("p",`${o.phone} • ${o.order_type==="delivery"?"Giao hàng":"Tự đến lấy"} • ${o.created_at}`,"muted"));
   if(o.address)info.append(node("p","Địa chỉ: "+o.address));
   if(o.notes)info.append(node("p","Ghi chú: "+o.notes));
   head.append(info,node("strong",money(o.total_vnd)));card.append(head);
   const ul=node("ul");for(const item of o.items)ul.append(node("li",`${item.quantity} × ${item.item_name} — ${money(item.subtotal_vnd)}`));card.append(ul);
   const row=node("div",undefined,"row");row.append(node("span","Trạng thái:"));
   const select=node("select");
   for(const [key,label] of Object.entries(statuses)){
    const option=node("option",label);option.value=key;option.selected=(o.status===key);select.append(option);
   }
   const save=node("button","Lưu trạng thái");
   save.addEventListener("click",async()=>{
    save.disabled=true;
    try{await request(`/api/admin/orders/${o.id}`,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({status:select.value})});await loadOrders()}
    catch(err){fail(err)}finally{save.disabled=false}
   });
   row.append(select,save);card.append(row);root.append(card);
  }
 }catch(err){fail(err)}
}
$("reload").addEventListener("click",loadOrders);loadOrders();
</script>
</body>
</html>
