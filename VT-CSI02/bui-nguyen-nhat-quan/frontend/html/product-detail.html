
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Chi tiết sản phẩm - TechZone AI</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-light">

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg bg-white border-bottom">
        <div class="container py-2">
            <a class="navbar-brand fw-bold" href="index.html">
                TechZone <span class="text-primary">AI</span>
            </a>

            <div class="d-flex gap-3">
                <a href="products.html" class="nav-link">
                    Sản phẩm
                </a>
                <a href="chat.html" class="nav-link">
                    AI Assistant
                </a>
                <a href="cart.html" class="nav-link">
                    Giỏ hàng
                </a>
            </div>
        </div>
    </nav>

    <main class="container py-5">

        <div class="mb-4">
            <a href="javascript:history.back()"
               class="text-decoration-none">
                ← Quay lại
            </a>
        </div>

        <!-- TRẠNG THÁI TẢI -->
        <div id="loading" class="text-center py-5">
            <div class="spinner-border text-primary"></div>
            <p class="mt-3 text-muted">
                Đang tải thông tin sản phẩm...
            </p>
        </div>

        <!-- THÔNG BÁO LỖI -->
        <div id="error-message"
             class="alert alert-danger d-none"></div>

        <!-- NỘI DUNG CHI TIẾT -->
        <div id="product-detail"
             class="row g-4 d-none">

            <!-- HÌNH ẢNH -->
            <div class="col-lg-5">
                <div class="product-image-box">
                    <img id="product-image"
                         alt="Hình sản phẩm"
                         class="d-none">

                    <div id="product-icon">💻</div>
                </div>
            </div>

            <!-- THÔNG TIN -->
            <div class="col-lg-7">
                <div class="product-detail-info">

                    <div id="product-brand"
                         class="text-muted mb-2"></div>

                    <h1 id="product-name"
                        class="fw-bold mb-3"></h1>

                    <h2 id="product-price"
                        class="text-primary fw-bold mb-3"></h2>

                    <p id="product-stock"
                       class="mb-3"></p>

                    <p id="product-description"
                       class="text-secondary"></p>

                    <hr>

                    <h5 class="fw-bold mb-3">
                        Thông số kỹ thuật
                    </h5>

                    <div id="product-specs"></div>

                    <div class="d-flex flex-wrap gap-2 mt-4">
                        <button
                            id="add-to-cart"
                            class="btn btn-primary px-4"
                            disabled>
                            Thêm vào giỏ hàng
                        </button>

                        <a href="chat.html"
                           class="btn btn-outline-primary">
                            Tư vấn bằng AI
                        </a>
                    </div>

                    <small class="text-muted d-block mt-3">
                        Tính năng giỏ hàng sẽ được phát triển
                        ở bước tiếp theo.
                    </small>

                </div>
            </div>

        </div>

    </main>

    <script src="../js/product-detail.js"></script>
    <script src="../js/cart.js"></script>
</body>
</html>
