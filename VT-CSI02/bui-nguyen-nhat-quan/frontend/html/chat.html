
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TechZone AI - Trợ lý mua sắm</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS riêng -->
    <link rel="stylesheet" href="../css/chat.css">
</head>

<body>

    <!-- THANH ĐIỀU HƯỚNG -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom">
        <div class="container">

            <a class="navbar-brand fw-bold" href="index.html">
                TechZone <span class="text-primary">AI</span>
            </a>

            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="index.html">Trang chủ</a>
                <a class="nav-link" href="products.html">Sản phẩm</a>
                <a class="nav-link active" href="chat.html">AI Assistant</a>
                <a class="nav-link" href="cart.html">Giỏ hàng</a>
            </div>

        </div>
    </nav>

    <!-- NỘI DUNG CHÍNH -->
    <main class="container my-4">

        <div class="row justify-content-center">
            <div class="col-lg-9">

                <div class="card shadow-sm border-0">

                    <!-- HEADER CHAT -->
                    <div class="card-header bg-white p-3">
                        <h5 class="mb-1">TechZone AI Assistant</h5>
                        <small class="text-muted">
                            Trợ lý tư vấn mua sắm công nghệ
                        </small>
                    </div>

                    <!-- KHU VỰC TIN NHẮN -->
                    <div class="card-body" id="chat-messages"
                         style="height: 450px; overflow-y: auto;">

                        <!-- Tin nhắn chào mừng -->
                        <div class="message bot">
                            <div class="message-content">
                                Xin chào! Mình là TechZone AI.
                                Bạn đang tìm điện thoại, laptop,
                                tai nghe hay phụ kiện công nghệ nào?
                            </div>
                        </div>

                    </div>

                    <!-- GỢI Ý CÂU HỎI -->
                    <div class="px-3 pb-2">
                        <p class="small text-muted mb-2">
                            Bạn có thể hỏi:
                        </p>

                        <div class="d-flex flex-wrap gap-2">
                            <button class="btn btn-outline-primary btn-sm suggestion-btn"
                                    type="button"
                                    data-message="Tư vấn laptop dưới 20 triệu">
                                Laptop dưới 20 triệu
                            </button>

                            <button class="btn btn-outline-primary btn-sm suggestion-btn"
                                    type="button"
                                    data-message="Gợi ý tai nghe gaming">
                                Tai nghe gaming
                            </button>

                            <button class="btn btn-outline-primary btn-sm suggestion-btn"
                                    type="button"
                                    data-message="Tư vấn chuột không dây">
                                Chuột không dây
                            </button>
                        </div>
                    </div>

                    <!-- Ô NHẬP TIN NHẮN -->
                    <div class="card-footer bg-white p-3">

                        <form id="chat-form">
                            <div class="input-group">

                                <input
                                    type="text"
                                    id="message-input"
                                    class="form-control"
                                    placeholder="Nhập câu hỏi của bạn..."
                                    autocomplete="off"
                                    required
                                >

                                <button class="btn btn-primary"
                                        type="submit"
                                        id="send-button">
                                    Gửi
                                </button>

                            </div>
                        </form>

                        <small class="text-muted d-block mt-2">
                            TechZone AI có thể đưa ra thông tin chưa chính xác.
                        </small>

                    </div>

                </div>
            </div>
        </div>

    </main>

    <!-- JAVASCRIPT -->
    <script src="../js/cart.js"></script>
    <script src="../js/chat.js"></script>
    

</body>
</html>
