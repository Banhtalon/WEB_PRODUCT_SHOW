
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Giỏ hàng - TechZone AI</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-light">

    <nav class="navbar navbar-expand-lg bg-white border-bottom">
        <div class="container py-2">
            <a class="navbar-brand fw-bold" href="index.html">
                TechZone <span class="text-primary">AI</span>
            </a>

            <div class="d-flex gap-3 flex-wrap">
                <a href="index.html" class="nav-link">Trang chủ</a>
                <a href="products.html" class="nav-link">Sản phẩm</a>
                <a href="chat.html" class="nav-link">AI Assistant</a>
                <a href="cart.html" class="nav-link text-primary fw-bold">
                    Giỏ hàng
                </a>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        <h2 class="fw-bold mb-4">Giỏ hàng của bạn</h2>

        <div class="row g-4">

            <div class="col-lg-8">
                <div id="cart-items">
                    Đang tải giỏ hàng...
                </div>
            </div>

            <div class="col-lg-4">
                <div class="bg-white border rounded-4 p-4">
                    <h5 class="fw-bold mb-3">Tóm tắt đơn hàng</h5>

                    <div class="d-flex justify-content-between mb-3">
                        <span>Số lượng sản phẩm</span>
                        <strong id="cart-count">0</strong>
                    </div>

                    <div class="d-flex justify-content-between mb-4">
                        <span>Tổng tiền</span>
                        <strong id="cart-total"
                                class="text-primary fs-5">
                            0đ
                        </strong>
                    </div>

                    <button class="btn btn-primary w-100" disabled>
                        Thanh toán
                    </button>

                    <small class="d-block text-muted mt-3">
                        Chức năng thanh toán chưa được triển khai.
                    </small>

                    <a href="products.html"
                       class="btn btn-outline-secondary w-100 mt-3">
                        Tiếp tục mua sắm
                    </a>
                </div>
            </div>

        </div>
    </main>

    <script src="../js/cart.js"></script>
</body>
</html>
