<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Matrix-Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <link rel="stylesheet" href="./style.css">
  </head>
  <body style="display: flex;justify-content: center;align-items: center;background-color: black;">
    <div class="vh-50 py-5" style="background:linear-gradient(135deg,#6610f2,#0d6efd);background-size: cover;margin:100px;">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-md-4">
            <div class="card border-0 shadow-lg rounded-4">
              <div class="card-body p-4">
                <h4 class="fw-bold text-center mb-4">Welcome to Matrix!</h4>
                <form action="index.html"><input class="form-control mb-3" placeholder="Username" required><input class="form-control mb-3" type="email" placeholder="Email" required><input class="form-control mb-3" type="password" placeholder="Password" required><button class="btn btn-primary w-100" style="position:static;">Signup</button>
                  <div class="text-center mt-3 small">Haven an account? <a href="./login.html">Log In</a></div>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>


    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
  </body>
</html>
