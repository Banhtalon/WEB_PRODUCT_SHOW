<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Giỏ hàng - SmashZone Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  </head>
  <body class="bg-light">
    <div class="container my-5">
      <!-- Thanh điều hướng đầu trang -->
      <div class="d-flex justify-content-between align-items-center mb-4">
        <a href="index.html" class="btn btn-outline-dark btn-sm">
          <i class="fas fa-arrow-left me-2"></i>Tiếp tục mua sắm
        </a>
        <h4 class="fw-bold mb-0 text-dark">
          <i class="fas fa-shopping-cart text-danger me-2"></i>Giỏ hàng của bạn
        </h4>
      </div>

      <div class="card shadow border-0 p-4">
        <div class="table-responsive">
          <table class="table align-middle">
            <thead>
              <tr>
                <th>Sản phẩm</th>
                <th>Phiên bản</th>
                <th>Đơn giá</th>
                <th>Số lượng</th>
                <th>Thành tiền</th>
                <th>Xóa</th>
              </tr>
            </thead>
            <tbody id="cart-body"></tbody>
          </table>
        </div>

        <div id="empty-msg" class="text-center py-4 text-muted d-none">
          Giỏ hàng đang trống. Hãy chọn thêm sản phẩm từ cửa hàng!
        </div>

        <div class="d-flex flex-wrap justify-content-between align-items-center mt-3 pt-3 border-top">
          <button class="btn btn-outline-secondary btn-sm" onclick="clearCart()">Xóa toàn bộ giỏ</button>
          <div class="text-end">
            <h5 class="mb-2">Tổng cộng: <span id="total-price" class="text-danger fw-bold">0₫</span></h5>
            <button class="btn btn-danger px-4" onclick="checkout()">Thanh toán đặt hàng</button>
          </div>
        </div>
      </div>
    </div>

    <script>
      function formatVND(number) {
        return number.toLocaleString("vi-VN") + "₫";
      }

      function renderCart() {
        let cart = JSON.parse(localStorage.getItem("myCart")) || [];
        let tbody = document.getElementById("cart-body");
        let emptyMsg = document.getElementById("empty-msg");
        tbody.innerHTML = "";
        let total = 0;

        if (cart.length === 0) {
          emptyMsg.classList.remove("d-none");
        } else {
          emptyMsg.classList.add("d-none");
        }

        for (let i = 0; i < cart.length; i++) {
          let item = cart[i];
          let itemTotal = item.price * item.quantity;
          total = total + itemTotal;

          tbody.innerHTML +=
            "<tr>" +
            "<td class='fw-bold'>" + item.name + "</td>" +
            "<td class='small text-muted'>" + item.color + " | " + item.spec + "</td>" +
            "<td>" + formatVND(item.price) + "</td>" +
            "<td>" +
              "<div class='input-group input-group-sm' style='width: 110px;'>" +
                "<button class='btn btn-outline-secondary' onclick='changeQty(" + i + ", -1)'>-</button>" +
                "<input type='text' class='form-control text-center' value='" + item.quantity + "' readonly>" +
                "<button class='btn btn-outline-secondary' onclick='changeQty(" + i + ", 1)'>+</button>" +
              "</div>" +
            "</td>" +
            "<td class='text-danger fw-bold'>" + formatVND(itemTotal) + "</td>" +
            "<td><button class='btn btn-sm btn-outline-danger' onclick='removeItem(" + i + ")'><i class='fas fa-trash'></i></button></td>" +
            "</tr>";
        }

        document.getElementById("total-price").innerText = formatVND(total);
      }

      function changeQty(index, change) {
        let cart = JSON.parse(localStorage.getItem("myCart")) || [];
        if (cart[index].quantity + change >= 1) {
          cart[index].quantity = cart[index].quantity + change;
          localStorage.setItem("myCart", JSON.stringify(cart));
          renderCart();
        }
      }

      function removeItem(index) {
        let cart = JSON.parse(localStorage.getItem("myCart")) || [];
        cart.splice(index, 1);
        localStorage.setItem("myCart", JSON.stringify(cart));
        renderCart();
      }

      function clearCart() {
        localStorage.removeItem("myCart");
        renderCart();
      }

      function checkout() {
        let cart = JSON.parse(localStorage.getItem("myCart")) || [];
        if (cart.length === 0) {
          alert("Giỏ hàng của bạn đang trống!");
          return;
        }
        alert("Đặt hàng thành công! Cảm ơn bạn đã mua sắm tại SmashZone.");
        localStorage.removeItem("myCart");
        renderCart();
      }

      renderCart();
    </script>
  </body>
</html>
