<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SS8 - Form Demo</title>
    <!-- Bootstrap 5.3.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light py-5">
    <div class="container" style="max-width: 600px;">
        <div class="card shadow-sm p-4 mb-4">
            <h2 class="h4 fw-bold mb-3">Gửi tin tức mới</h2>
            <form action="/submit_form" method="post">
                <div class="mb-3">
                    <label for="fname" class="form-label">Tên:</label>
                    <input type="text" class="form-control" id="fname" name="fname">
                </div>
                <div class="mb-3">
                    <label for="lname" class="form-label">Họ:</label>
                    <input type="text" class="form-control" id="lname" name="lname">
                </div>
                <button type="submit" class="btn btn-primary">Gửi</button>
            </form>
        </div>

        <div class="card shadow-sm p-4 mb-4">
            <h2 class="h4 fw-bold mb-3"> Upload File</h2>
            <form action="https://www.example.com/upload_file" method="post" enctype="multipart/form-data">
                <div class="mb-3">
                    <label for="myFile" class="form-label">Chọn tệp tin:</label>
                    <input class="form-control" type="file" id="myFile" name="myFile">
                </div>
                <button type="submit" class="btn btn-success">Upload File</button>
            </form>
        </div>
    </div>

    <!-- Bootstrap 5.3.3 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
