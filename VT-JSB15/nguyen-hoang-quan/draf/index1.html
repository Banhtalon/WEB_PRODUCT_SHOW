<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Computer Store - Phụ kiện công nghệ</title>
    <link rel="stylesheet" href="css/style.css" />
    <style>
      #special-text {
        color: blue;
      }
      .hero-contain h1 {
        color: rgb(246, 150, 7);
      }
    </style>
  </head>
  <body id="#top">
    <header class="header">
      <div class="container header-inner">
        <a class="logo" href="#top">COMPUTER STORE</a>
        <nav class="nav">
          <a href="#top">Trang chủ</a>
          <a href="#product">Sản phẩm</a>
          <a href="#about">Giới thiệu</a>
          <a href="#offer">Ưu đãi</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="hero">
        <div class="container hero-inner">
          <div class="hero-content">
            <p class="eyebrow">BỘ SƯU TẬP</p>
            <h1>Nâng góc trải nghiệm của bạn</h1>
            <p class="hero-description">
              Những phụ kiện công nghệ đơn giản, hiện đại và phù hợp cho học
              tập, làm việc mỗi ngày.
            </p>
            <a class="button" href="#product">Xem sản phẩm</a>
          </div>

          <div class="hero-image">
            <img src="./images/hero-product.jpg" alt="Sản phẩm nổi bật" />
          </div>
        </div>
      </section>

      <!-- ========================================================================================= -->
      <!-- PHẦN PRODUCTS: Khu vực hiển thị danh sách các thẻ Sản phẩm                             -->
      <!-- ========================================================================================= -->
      <section class="product-section" id="product"></section>

      <!-- ========================================================================================= -->
      <!-- PHẦN ABOUT: Khu vực hiển thị thông tin giới thiệu                           -->
      <!-- ========================================================================================= -->
      <section class="about-section" id="about"></section>

      <!-- ========================================================================================= -->
      <!-- PHẦN OFFER: Khu vực hiển thị thông tin ưu đãi                             -->
      <!-- ========================================================================================= -->
      <section class="offer-section" id="offer"></section>
    </main>
  </body>
</html>
