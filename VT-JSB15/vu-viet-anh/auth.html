<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng Nhập & Đăng Ký - Minecraft Universe</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body class="auth-body">
    <div
      class="container d-flex justify-content-center align-items-center min-vh-100 py-5"
    >
      <div
        class="auth-card p-4 p-md-5 rounded-4 shadow-lg bg-white position-relative overflow-hidden"
      >
        <div class="mb-3">
          <a
            href="index.html"
            class="text-muted small text-decoration-none d-inline-flex align-items-center gap-1"
          >
            <i class="bi bi-arrow-left"></i> Quay lại trang chủ
          </a>
        </div>
        <div class="text-center mb-4">
          <a
            href="index.html"
            class="text-decoration-none text-success fw-bold fs-3 d-inline-flex align-items-center gap-2"
          >
             <img
            src="./image/Minecraft_Logo.webp"
            alt="Minecraft Logo"
            width="200"
            height="auto"
          />
          </a>
          <p class="text-muted small mt-1">
            Chào mừng bạn quay trở lại với cộng đồng Minecraft!
          </p>
        </div>
        <ul
          class="nav nav-pills nav-justified mb-4 auth-tabs p-1 rounded-pill bg-light"
          id="authTab"
          role="tablist"
        >
          <li class="nav-item" role="presentation">
            <button
              class="nav-link active rounded-pill fw-semibold"
              id="login-tab"
              data-bs-toggle="tab"
              data-bs-target="#login-tab-pane"
              type="button"
              role="tab"
            >
              Đăng Nhập
            </button>
          </li>
          <li class="nav-item" role="presentation">
            <button
              class="nav-link rounded-pill fw-semibold"
              id="register-tab"
              data-bs-toggle="tab"
              data-bs-target="#register-tab-pane"
              type="button"
              role="tab"
            >
              Đăng Ký
            </button>
          </li>
        </ul>
        <div class="tab-content" id="authTabContent">
          <div
            class="tab-pane fade show active"
            id="login-tab-pane"
            role="tabpanel"
          >
            <form>
              <div class="mb-3">
                <label class="form-label fw-semibold"
                  >Tên tài khoản hoặc Email</label
                >
                <div class="input-group">
                  <span class="input-group-text bg-light border-end-0"
                    ><i class="bi bi-person text-muted"></i
                  ></span>
                  <input
                    type="text"
                    class="form-control bg-light border-start-0"
                    placeholder="Nhập username hoặc email"
                    required
                  />
                </div>
              </div>
              <div class="mb-3">
                <div class="d-flex justify-content-between align-items-center">
                  <label class="form-label fw-semibold">Mật khẩu</label>
                  <a href="#" class="text-success small text-decoration-none"
                    >Quên mật khẩu?</a
                  >
                </div>
                <div class="input-group">
                  <span class="input-group-text bg-light border-end-0"
                    ><i class="bi bi-lock text-muted"></i
                  ></span>
                  <input
                    type="password"
                    class="form-control bg-light border-start-0"
                    placeholder="••••••••"
                    required
                  />
                </div>
              </div>
              <div class="mb-3 form-check">
                <input
                  type="checkbox"
                  class="form-check-input"
                  id="rememberMe"
                />
                <label
                  class="form-check-label text-muted small"
                  for="rememberMe"
                  >Ghi nhớ đăng nhập</label
                >
              </div>
              <a href="index.html" type="submit" class="btn btn-success w-100 rounded-pill py-2 fw-semibold shadow-sm">
                Đăng Nhập
              </a>
            </form>
          </div>
          <div class="tab-pane fade" id="register-tab-pane" role="tabpanel">
            <form>
              <div class="mb-3">
                <label class="form-label fw-semibold"
                  >Tên người dùng (Username)</label
                >
                <div class="input-group">
                  <span class="input-group-text bg-light border-end-0"
                    ><i class="bi bi-person-badge text-muted"></i
                  ></span>
                  <input
                    type="text"
                    class="form-control bg-light border-start-0"
                    placeholder="Nhập tên tài khoản"
                    required
                  />
                </div>
              </div>
              <div class="mb-3">
                <label class="form-label fw-semibold">Địa chỉ Email</label>
                <div class="input-group">
                  <span class="input-group-text bg-light border-end-0"
                    ><i class="bi bi-envelope text-muted"></i
                  ></span>
                  <input
                    type="email"
                    class="form-control bg-light border-start-0"
                    placeholder="name@example.com"
                    required
                  />
                </div>
              </div>
              <div class="mb-3">
                <label class="form-label fw-semibold">Mật khẩu</label>
                <div class="input-group">
                  <span class="input-group-text bg-light border-end-0"
                    ><i class="bi bi-lock text-muted"></i
                  ></span>
                  <input
                    type="password"
                    class="form-control bg-light border-start-0"
                    placeholder="Tối thiểu 6 ký tự"
                    required
                  />
                </div>
              </div>
              <div class="mb-3">
                <label class="form-label fw-semibold">Xác nhận mật khẩu</label>
                <div class="input-group">
                  <span class="input-group-text bg-light border-end-0"
                    ><i class="bi bi-shield-check text-muted"></i
                  ></span>
                  <input
                    type="password"
                    class="form-control bg-light border-start-0"
                    placeholder="Nhập lại mật khẩu"
                    required
                  />
                </div>
              </div>
              <div class="mb-3 form-check">
                <input
                  type="checkbox"
                  class="form-check-input"
                  id="terms"
                  required
                />
                <label class="form-check-label text-muted small" for="terms"
                  >Tôi đồng ý với
                  <a href="#" class="text-success text-decoration-none"
                    >Điều khoản dịch vụ</a
                  ></label
                >
              </div>
              <a
                href="auth.html"
                type="submit"
                class="btn btn-success w-100 rounded-pill py-2 fw-semibold shadow-sm"
              >
                Tạo Tài Khoản
              </a>
            </form>
          </div>
        </div>
        <div class="position-relative my-4 text-center">
          <hr class="text-muted" />
          <span
            class="position-absolute top-50 start-50 translate-middle px-3 bg-white text-muted small"
            >Hoặc tiếp tục với</span
          >
        </div>
        <div class="d-flex gap-2">
          <button
            class="btn btn-outline-light border text-dark w-50 rounded-pill d-flex align-items-center justify-content-center gap-2 py-2"
          >
            <i class="bi bi-google text-danger"></i>
            <span class="small fw-semibold">Google</span>
          </button>
          <button
            class="btn btn-outline-light border text-dark w-50 rounded-pill d-flex align-items-center justify-content-center gap-2 py-2"
          >
            <i class="bi bi-github text-dark"></i>
            <span class="small fw-semibold">GitHub</span>
          </button>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
