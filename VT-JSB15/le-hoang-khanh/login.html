<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập & Đăng ký</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="login.css" />
  </head>
  <body class="bg-light d-flex flex-column align-items-center justify-content-center min-vh-100 py-4">

    <div class="container text-end mb-3" style="max-width: 400px">
      <a href="index.html" class="btn btn-outline-danger btn-sm shadow-sm">← Quay lại trang chủ</a>
    </div>

    <div class="login-container p-4 bg-white rounded shadow-sm" style="max-width: 400px; width: 100%;">
      
      <!-- Thanh chuyển Tab Đăng nhập / Đăng ký -->
      <ul class="nav nav-pills nav-justified mb-4" id="authTab" role="tablist">
        <li class="nav-item" role="presentation">
          <button class="nav-link active fw-bold text-danger" id="login-tab" data-bs-toggle="tab" data-bs-target="#login-pane" type="button" role="tab">ĐĂNG NHẬP</button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link fw-bold text-danger" id="register-tab" data-bs-toggle="tab" data-bs-target="#register-pane" type="button" role="tab">ĐĂNG KÝ</button>
        </li>
      </ul>

      <div class="tab-content" id="authTabContent">
        <div class="tab-pane fade show active" id="login-pane" role="tabpanel">
          <h3 class="text-center fw-bold mb-3" style="color: #dc3545;">SIGN IN</h3>
          <form action="index.html">
            <div class="mb-3">
              <input type="text" class="form-control form-input" placeholder="Tên đăng nhập (Username)" required />
            </div>
            <div class="mb-3">
              <input type="password" class="form-control form-input" placeholder="Mật khẩu (Password)" required />
            </div>
            <button type="submit" class="btn btn-danger w-100 py-2 fw-bold btn-submit">SIGN IN</button>
          </form>
        </div>

        <div class="tab-pane fade" id="register-pane" role="tabpanel">
          <h3 class="text-center fw-bold mb-3" style="color: #dc3545;">SIGN UP</h3>
          <form action="login.html">
            <div class="mb-3">
              <input type="text" class="form-control form-input" placeholder="Họ và tên" required />
            </div>
            <div class="mb-3">
              <input type="email" class="form-control form-input" placeholder="Email" required />
            </div>
            <div class="mb-3">
              <input type="text" class="form-control form-input" placeholder="Tên đăng nhập" required />
            </div>
            <div class="mb-3">
              <input type="password" class="form-control form-input" placeholder="Mật khẩu" required />
            </div>
            <div class="mb-3">
              <input type="password" class="form-control form-input" placeholder="Xác nhận mật khẩu" required />
            </div>
            <button type="submit" class="btn btn-danger w-100 py-2 fw-bold btn-submit">ĐĂNG KÝ MỚI</button>
          </form>
        </div>

      </div>

      <div class="text-center mt-4">
        <a href="index.html" class="text-decoration-none text-secondary small back-home">Quay lại trang chủ</a>
      </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
